[package]
name = "owly-airdrop"
description = "AirDrop: a sans-IO protocol core, and a driver for it on tokio and rustls."
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/t4t5/owly"
keywords = ["airdrop", "awdl", "apple", "file-transfer", "sans-io"]
categories = ["network-programming"]

[features]
default = ["tokio"]
# The driver: TLS, sockets and sandboxed extraction. Without it, only the
# sans-IO core is built.
tokio = [
    "dep:tokio",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rcgen",
    "dep:p256",
    "dep:getrandom",
    "dep:tempfile",
    "dep:tracing",
    "dep:nix",
]
# An mDNS/DNS-SD responder and browser on one interface, for hosts without a
# system responder.
mdns = ["tokio", "dep:socket2"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

getrandom = { version = "0.3", optional = true }
# Pure Rust, so the driver builds for any target. The application chooses
# rustls's crypto provider.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"], optional = true }
rcgen = { version = "0.14", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
socket2 = { version = "0.6", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time", "fs"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"], optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
