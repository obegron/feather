[package]
name = "feather-transfer"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
owly-airdrop = {path="vendor/owly-airdrop", features=["mdns"]}
tokio = {version="1",features=["io-std","io-util","macros","rt-multi-thread","sync","time","signal"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
rustls = {version="0.23",default-features=false,features=["ring","std","tls12"]}
getrandom = "0.3"
nix = {version="0.31",default-features=false,features=["net"]}
zbus = {version="5",default-features=false,features=["tokio"]}
